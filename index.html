  const db = firebase.database();
  window.db = db;

  // Readonly detection — online = readonly, local file = editable
  const _isLocal = window.location.protocol === 'file:';
  const _forceEdit = new URLSearchParams(window.location.search).get('edit') === '1';
  window.READONLY_MODE = !_isLocal && !_forceEdit;
  if(window.READONLY_MODE){ document.body.classList.add('readonly'); }

  // Universal sync
  function fbRead(key, cb){
    db.ref('tracker/'+key).once('value').then(snap=>{
      const val = snap.val();
      if(val) cb(val);
      else {
        // fallback to localStorage
        try{ const ls = JSON.parse(localStorage.getItem(key)); if(ls) cb(ls); }catch(e){}
      }
    }).catch(()=>{
      try{ const ls = JSON.parse(localStorage.getItem(key)); if(ls) cb(ls); }catch(e){}
    });
  }
  function fbWrite(key, obj){
    // Write localStorage immediately (fast UI)
    try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
    // Write Firebase (sync to web)
    db.ref('tracker/'+key).set(obj).catch(e=>console.warn('Firebase write failed',e));
  }
  function fbListen(key, cb){
    db.ref('tracker/'+key).on('value', snap=>{ if(snap.val()) cb(snap.val()); });
  }

<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

// READONLY MODE — if URL has ?view=1, disable all editing
const READONLY = window.READONLY_MODE || false;

/* ============ RAW DATA ============ */
const MATHS_CHAPTERS = [
  ["Basic Mathematics",14],["Quadratic Equations",9],["Sequence and Series",9],
  ["Trigonometric Functions",8],["Trigonometric Equation",5],["Binomial Theorem",7],
  ["Straight Lines",10],["Circles",8],["Parabola",7],["Ellipse",5],["Determinants",4],
  ["Hyperbola",2],["Matrices",5],["Sets",3],["Relations and Functions",12],
  ["Methods of Differentiation",2],["Inverse Trigonometric Functions",5],
  ["Limit, Continuity and Differentiability",9],["Indefinite Integration",5],
  ["Application of Derivatives",7],["Definite Integration",6],["Differential Equation",3],
  ["Application of Integrals",1],["Vector Algebra",4],["Three Dimensional Geometry",4],
  ["Statistics",2],["Complex Number",5],["Solution of Triangle",2],
  ["Permutations and Combinations",9],["Probability",5]
];

const OC_CHAPTERS = [
  ["IUPAC Nomenclature",10],["General Organic Chemistry (GOC)",14],["Isomerism",17],
  ["Hydrocarbons",15],["Haloalkanes & Haloarenes",8],["Alcohols, Phenols & Ethers",6],
  ["Aldehydes, Ketones & Carboxylic Acids",6],["Amines",2],["Biomolecules",3]
];

/* QPT blocks — physics & chem(PC/IOC) dedicated chapters, + OC cumulative threshold */
const BLOCKS = [
  { id:1, label:"QPT 1",
    physics:[["Units and Measurements",2],["Mathematical Tools",7],["Motion in a Straight Line",7],["Motion in a Plane",4]],
    chem:[["Mole Concept",14],["Structure of Atom",8]], ocUpto:0 },
  { id:2, label:"QPT 2",
    physics:[["Laws of Motion",13],["Work, Energy and Power",9]],
    chem:[["Solutions",8],["Electrochemistry",6],["Chemical Kinetics",7]], ocUpto:0 },
  { id:3, label:"QPT 3",
    physics:[["COM and System of Particles",15],["Rotational Motion",19],["Relative Motion",4],["Circular Motion",10]],
    chem:[["Chemical Equilibrium",5],["Ionic Equilibrium",7]], ocUpto:0 },
  { id:4, label:"QPT 4", isPrepCheck:true, prepCheckLabel:"QPT 1–3 Prep Check",
    physics:[], chem:[], ocUpto:0 },
  { id:5, label:"QPT 5",
    physics:[["Dual Nature",4],["Atom",3],["Nuclei",3]],
    chem:[["Redox Reactions",7],["Thermodynamics (Chem)",13]], ocUpto:0 },
  { id:6, label:"QPT 6",
    physics:[["Kinetic Theory of Gases",3],["Thermal Properties of Matter",6],["Thermodynamics",4]],
    chem:[["Periodic Table",10],["Chemical Bonding",20]], ocUpto:0 },
  { id:7, label:"QPT 7",
    physics:[["Mechanical Properties of Fluids",9],["Mechanical Properties of Solids",1],["Oscillations",8]],
    chem:[], ocUpto:41 },
  { id:8, label:"QPT 8", isPrepCheck:true, prepCheckLabel:"QPT 5–7 Prep Check",
    physics:[], chem:[], ocUpto:0 },
  { id:9, label:"QPT 9",
    physics:[["Electric Charges, Fields and Potential",17],["Gravitation",2]],
    chem:[], ocUpto:64 },
  { id:10, label:"QPT 10",
    physics:[["Electrostatic Potential and Capacitance",6],["Current Electricity",9]],
    chem:[], ocUpto:76 },
  { id:11, label:"QPT 11", isPrepCheck:true, prepCheckLabel:"QPT 9–10 Prep Check",
    physics:[], chem:[], ocUpto:0 },
  { id:12, label:"QPT 12",
    physics:[["Moving Charges and Magnetism",12]],
    chem:[], ocUpto:78 },
  { id:13, label:"QPT 13",
    physics:[["Electromagnetic Induction",7],["Alternating Current",3]],
    chem:[["Coordination Compounds",14]], ocUpto:81 },
  { id:14, label:"QPT 14", isPrepCheck:true, prepCheckLabel:"QPT 12–13 Prep Check",
    physics:[], chem:[], ocUpto:0 },
  { id:15, label:"QPT 15",
    physics:[["Wave Optics",6],["Ray Optics and Optical Instruments",18]],
    chem:[["D and F Block Elements",6],["P-block Elements",7]], ocUpto:81 },
  { id:16, label:"QPT 16",
    physics:[["Waves",9],["Electromagnetic Waves",1],["Semiconductor",2]],
    chem:[], ocUpto:81 },
  { id:17, label:"Post QPT 16",
    physics:[],
    chem:[["Qualitative Analysis",6],["Metallurgy",1],["S Block",3],["Hydrogen",1],["Jwala Batch",4],["Advanced Lectures",4]], ocUpto:81 },
];

/* ============ SCHEDULE ENGINE ============ */
function buildSchedule(){
  const days = [];
  let mathsChapIdx=0, mathsLecDone=0;
  let ocChapIdx=0, ocLecDone=0, ocTotalDone=0;
  const OC_TOTAL = OC_CHAPTERS.reduce((s,c)=>s+c[1],0);

  // deep-copy per-chapter remaining counters for physics & chem across all blocks
  const blockState = BLOCKS.map(b=>({
    id:b.id,label:b.label,
    physics: b.physics.map(([n,c])=>({name:n, total:c, done:0})),
    chem: b.chem.map(([n,c])=>({name:n, total:c, done:0})),
    ocUpto: b.ocUpto,
  }));

  function ocRemainingGlobal(){ return OC_TOTAL - ocTotalDone; }
  function pullOC(n){
    // returns array of {name, from, to} lecture-units consumed, advances oc pointer
    const out=[];
    let need=n;
    while(need>0 && ocChapIdx<OC_CHAPTERS.length){
      const [cname,ctotal]=OC_CHAPTERS[ocChapIdx];
      const avail = ctotal - ocLecDone;
      const take = Math.min(avail, need);
      if(take>0){ out.push({name:cname, start:ocLecDone+1, end:ocLecDone+take}); ocLecDone+=take; ocTotalDone+=take; need-=take; }
      if(ocLecDone>=ctotal){ ocChapIdx++; ocLecDone=0; }
    }
    return out;
  }
  function pullFromChapterList(list, n){
    const out=[]; let need=n;
    for(const ch of list){
      if(need<=0) break;
      const avail = ch.total - ch.done;
      if(avail<=0) continue;
      const take = Math.min(avail, need);
      out.push({name:ch.name, start:ch.done+1, end:ch.done+take});
      ch.done += take; need-=take;
    }
    return {taken:out, remaining:need};
  }
  function listDone(list){ return list.every(c=>c.done>=c.total); }

  let bIdx=0;
  let dayNum=1;
  let dateCursor = new Date(2026,7,6); // Aug 6 2026 (month index 7)
  const MAX_DAYS=400;

  while(bIdx < blockState.length && dayNum<MAX_DAYS){
    const blk = blockState[bIdx];
    const physDone = listDone(blk.physics);
    const chemDedDone = listDone(blk.chem);
    const ocDone = ocTotalDone >= blk.ocUpto;
    const blockFullyDone = physDone && chemDedDone && ocDone;

    const dateStr = dateCursor.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

    // MATHS: up to 3 slots/day from master list; once exhausted, leftover slots convert to Physics
    function pullMaths(need){
      const out=[];
      while(need>0 && mathsChapIdx<MATHS_CHAPTERS.length){
        const [cname,ctotal]=MATHS_CHAPTERS[mathsChapIdx];
        const avail = ctotal-mathsLecDone;
        const take=Math.min(avail,need);
        if(take>0){ out.push({name:cname,start:mathsLecDone+1,end:mathsLecDone+take}); mathsLecDone+=take; need-=take; }
        if(mathsLecDone>=ctotal){ mathsChapIdx++; mathsLecDone=0; }
      }
      return {taken:out, remaining:need};
    }
    function pullPhysicsChain(need, physList){
      const out=[];
      const r = pullFromChapterList(physList, need);
      out.push(...r.taken); need=r.remaining;
      if(need>0 && ocRemainingGlobal()>0){
        const pulled = pullOC(need); out.push(...pulled.map(p=>({...p, isOC:true})));
        need -= pulled.reduce((s,p)=>s+(p.end-p.start+1),0);
      }
      if(need>0){
        for(let j=bIdx+1;j<blockState.length && need>0;j++){
          const r2 = pullFromChapterList(blockState[j].physics, need);
          out.push(...r2.taken.map(t=>({...t, aheadFrom:blockState[j].label})));
          need = r2.remaining;
        }
      }
      return {taken:out, remaining:need};
    }

    if(blk.isPrepCheck || blockFullyDone){
      // TEST DAY — only maths 3 (unless maths already exhausted, then physics fills in)
      const mr = pullMaths(3);
      const mathsToday = mr.taken;
      let physToday = [];
      if(mr.remaining>0){
        const pr = pullPhysicsChain(mr.remaining, blk.physics);
        physToday = pr.taken.map(t=>({...t, fromMathsSlot:true}));
      }
      const isPrepCheck = !!blk.isPrepCheck;
      days.push({day:dayNum,date:dateStr,isTest:true,testLabel:blk.label,isPrepCheck,prepCheckLabel:blk.prepCheckLabel||'',maths:mathsToday,physics:physToday,chem:[]});
      dayNum++; dateCursor.setDate(dateCursor.getDate()+1);
      bIdx++;
      continue;
    }

    // CONTENT DAY
    const mr = pullMaths(3);
    const mathsToday = mr.taken;
    const mathsOverflow = mr.remaining;

    // CHEM 2 slots: dedicated chapters first, then OC-threshold filler, then gap->OC beyond, then pull-ahead physics
    const chemToday=[];
    { let need=2;
      const r = pullFromChapterList(blk.chem, need);
      chemToday.push(...r.taken); need = r.remaining;
      if(need>0){
        const ocNeed = Math.max(0, Math.min(need, blk.ocUpto - ocTotalDone));
        if(ocNeed>0){ const pulled=pullOC(ocNeed); chemToday.push(...pulled); need-=ocNeed; }
      }
      if(need>0 && ocRemainingGlobal()>0){
        const pulled = pullOC(need); chemToday.push(...pulled); need -= pulled.reduce((s,p)=>s+(p.end-p.start+1),0);
      }
      if(need>0){
        // OC fully exhausted — fall back to pulling ahead physics content into the chem slot
        for(let j=bIdx;j<blockState.length && need>0;j++){
          const r2 = pullFromChapterList(blockState[j].physics, need);
          chemToday.push(...r2.taken.map(t=>({...t, aheadFrom:blockState[j].label, isPhysicsFallback:true})));
          need = r2.remaining;
        }
      }
    }

    // PHYSICS: normal 2 slots + maths-overflow slots (once maths master list is fully done)
    const pr = pullPhysicsChain(2 + mathsOverflow, blk.physics);
    const physToday = pr.taken;
    if(mathsOverflow>0){
      let remainMark = mathsOverflow;
      for(let i=physToday.length-1;i>=0 && remainMark>0;i--){
        const units = physToday[i].end-physToday[i].start+1;
        physToday[i] = {...physToday[i], fromMathsSlot:true};
        remainMark -= units;
      }
    }

    // If physics slot produced 0 lecs (physics fully done), use those 2 slots for extra chem
    const physProduced = physToday.reduce((s,p)=>s+(p.end-p.start+1),0);
    if(physProduced < 2){
      const extraNeed = 2 - physProduced;
      let need = extraNeed;
      if(need>0 && ocRemainingGlobal()>0){
        const pulled = pullOC(need); chemToday.push(...pulled.map(p=>({...p, extraPhysSlot:true}))); need -= pulled.reduce((s,p)=>s+(p.end-p.start+1),0);
      }
      if(need>0){
        for(let j=bIdx;j<blockState.length && need>0;j++){
          const r2 = pullFromChapterList(blockState[j].chem, need);
          chemToday.push(...r2.taken.map(t=>({...t, extraPhysSlot:true})));
          need = r2.remaining;
        }
      }
    }

    days.push({day:dayNum,date:dateStr,isTest:false,blockLabel:blk.label,maths:mathsToday,physics:physToday,chem:chemToday});
    dayNum++; dateCursor.setDate(dateCursor.getDate()+1);
  }
  return days;
}

/* flatten into a checklist item id list for progress tracking */
function collectItems(days){
  const items=[];
  days.forEach(d=>{
    ['maths','physics','chem'].forEach(subj=>{

        items.push({id:`d${d.day}-${subj}-${i}-${it.name}-${it.start}-${it.end}`, day:d.day, subj, name:it.name, start:it.start, end:it.end});
      });
    });
  });
  return items;
}

// Build a list of {studyDay, dueDay, interval, subjs} from SCHEDULE
// subjs = which subjects had content that day
function buildRevisionEntries(){
  const entries = [];
  SCHEDULE.forEach(d=>{
    if(d.isTest) return;
    const subjs = [];
    if((d.maths||[]).length>0) subjs.push('maths');
    if((d.physics||[]).length>0) subjs.push('physics');
    if((d.chem||[]).length>0) subjs.push('chem');
    if(subjs.length===0) return;
    REVISION_INTERVALS.forEach(interval=>{
      entries.push({ studyDay:d.day, studyDate:d.date, dueDay:d.day+interval, interval, subjs });
    });
  });
  return entries;
}

function dayNumToDate(dayNum){
  const d = new Date(2026,7,6); // Aug 6 2026
  d.setDate(d.getDate() + dayNum - 1);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

                        return <span style={{fontSize:11,color:ed===et?'var(--ok)':'var(--text-dim)'}}>{ed}/{et} done</span>;
                      })()}
                    </div>

                    {/* Subject columns */}
                    <div className="subject-grid">
                      {e.subjs.map(subj=>{
                        const tasks = REVISE_TASKS[subj][e.interval]||[];
                        const meta  = SUBJ_META[subj];
                        return (
                          <div key={subj} className="subj-col">
                            <div className="subj-lbl" style={{color:meta.color}}>{meta.label}</div>
                            {tasks.map(t=>{
                              const id=`rev-d${e.studyDay}-i${e.interval}-${subj}-${t}`;
                              const isChk=!!checked[id];
                              return (
                                <div key={t} className={'lec-row'+(isChk?' checked':'')}>
                                  <input type="checkbox" id={id} checked={isChk} onChange={()=>toggle(id)}/>
                                  <label htmlFor={id} style={{fontSize:12}}>{t}</label>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function getUniqueChapters(items){
  // returns unique chapter names preserving order
  const seen = new Set();
  return items.filter(it=>{ if(seen.has(it.name)) return false; seen.add(it.name); return true; });
}

function PracticeTab(){
  const [checked, setChecked] = useState(loadPractice);
  const todayNum = useToday();
  const [filter, setFilter] = useState('all');
  const [jump, setJump] = useState('');
  const listRef = useRef(null);

  useEffect(()=>{ savePractice(checked); },[checked]);

  const toggle = (id) => setChecked(prev=>({...prev,[id]:!prev[id]}));

  // Build practice days from SCHEDULE — skip test days (no new chapters to practice)
  const practiceDays = SCHEDULE.map(d=>{
    const physChaps = getUniqueChapters((d.physics||[]).filter(it=>!it.isOC && !it.aheadFrom));
    const chemChaps = getUniqueChapters((d.chem||[]).filter(it=>!it.aheadFrom && !it.isPhysicsFallback));
    const mathChaps = getUniqueChapters(d.maths||[]);
    return { day:d.day, date:d.date, physics:physChaps, chem:chemChaps, maths:mathChaps };
  }).filter(d=> d.physics.length||d.chem.length||d.maths.length);

  // total & done for progress
  let totalTasks=0, doneTasks=0;
  practiceDays.forEach(d=>{
    [['physics',d.physics],['chem',d.chem],['maths',d.maths]].forEach(([subj,chaps])=>{
      chaps.forEach(ch=>{
        PRACTICE_TASKS.forEach(t=>{

  const pct = totalTasks ? Math.round(doneTasks/totalTasks*100) : 0;

  const filtered = practiceDays.filter(d=>{
    if(filter==='all') return true;
    if(filter==='today') return d.day===todayNum;
    if(filter==='pending') return d.day>=todayNum;
    if(filter==='done') return d.day<todayNum;
    return true;
  });

  const jumpToDay=()=>{
    const n=parseInt(jump,10); if(!n) return;
    const el=document.getElementById('pday-'+n);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});

  const SUBJS=[
    {key:'physics', label:'⚡ Physics', color:'#4fa8e8', chaps: d=>d.physics},
    {key:'chem',    label:'🧪 Chemistry', color:'#e85d7a', chaps: d=>d.chem},
    {key:'maths',   label:'📐 Maths',   color:'#e8a13c', chaps: d=>d.maths},
  ];

  return (
    <div>
      <div className="hero">
        <div>
          <h1>Practice Schedule</h1>
          <p>Allen Modules + PYQs · Synced with Study tab · Chapter-wise daily</p>
        </div>
        <div className="stat-row">
          <div className="stat"><div className="num">{doneTasks}/{totalTasks}</div><div className="lbl">Tasks</div></div>
          <div className="stat"><div className="num gold">{pct}%</div><div className="lbl">Complete</div></div>
        </div>
      </div>

      <div className="progress-wrap">
        <div className="progress-bar-outer"><div className="progress-bar-inner" style={{width:pct+'%'}}></div></div>
        <div className="progress-label"><span>Day 1 · Aug 6 2026</span><span>{practiceDays.length} days</span></div>
      </div>

      <div className="legend">
        <span><span className="dot" style={{background:'#e8a13c'}}></span>Maths</span>
        <span><span className="dot" style={{background:'#4fa8e8'}}></span>Physics</span>
        <span><span className="dot" style={{background:'#e85d7a'}}></span>Chemistry</span>
      </div>

      <div className="filterbar">
        {['all','today','pending','done'].map(f=>(
          <button key={f} className={"chip"+(filter===f?' active':'')} onClick={()=>setFilter(f)}>{f}</button>
        ))}
        <div className="jumpbox">
          <input placeholder="Day #" value={jump} onChange={e=>setJump(e.target.value)} />
          <button className="jumpbtn" onClick={jumpToDay}>Jump</button>
        </div>
      </div>

      <div className="day-list" ref={listRef}>
        {filtered.map(d=>{
          const isToday = d.day===todayNum;
          // check if all tasks for this day are done
          let dayTotal=0, dayDone=0;
          SUBJS.forEach(s=>{ s.chaps(d).forEach(ch=>{ PRACTICE_TASKS.forEach(t=>{ dayTotal++; if(checked[`p-d${d.day}-${s.key}-${ch.name}-${t.key}`]) dayDone++; }); }); });
          const allDone = dayTotal>0 && dayDone===dayTotal;

          return (
            <div id={'pday-'+d.day} key={d.day} className={"day-card"+(isToday?' today':'')+(allDone?' done':'')}>
              <div className="day-head">
                <div className="dtitle">
                  <span className="dnum">Day {d.day}</span>
                  <span className="ddate">{d.date}</span>
                </div>
                <div>
                  {isToday && <span className="badge today">Today</span>}
                  {allDone && !isToday && <span className="badge done">Done</span>}
                </div>
              </div>
              <div className="subject-grid">
                {SUBJS.map(s=>{
                  const chaps = s.chaps(d);
                  return (
                    <div key={s.key} className={"subj-col "+s.key}>
                      <div className="subj-lbl" style={{color:s.color}}>{s.label}</div>
                      {chaps.length===0 && <div className="empty">—</div>}
                      {chaps.map(ch=>(
                        <div key={ch.name} style={{marginBottom:8}}>
                          <div style={{fontSize:'11px',fontWeight:700,color:'var(--text-hi)',marginBottom:3}}>{ch.name}</div>
                          {PRACTICE_TASKS.map(t=>{
                            const id=`p-d${d.day}-${s.key}-${ch.name}-${t.key}`;
                            const isChk=!!checked[id];
                            return (
                              <div key={t.key} className={"lec-row"+(isChk?' checked':'')}>
                                <input type="checkbox" id={id} checked={isChk} onChange={()=>toggle(id)} />
                                <label htmlFor={id} style={{fontSize:'11.5px'}}>{t.label}</label>
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function buildNIOSSchedule(plan){
  const days = [];
  // per subject, track chapter index and how many done
  const state = plan.subjects.map(s=>({ chapIdx:0 }));
  const start = new Date(plan.startDate);

  for(let d=0;d<plan.days;d++){
    const dateObj = new Date(start); dateObj.setDate(start.getDate()+d);
    const dateStr = dateObj.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    const dayEntry = { day:d+1, date:dateStr, subjects:[] };

    plan.subjects.forEach((subj, si)=>{
      const chaps = [];
      for(let p=0;p<subj.perDay;p++){
        if(state[si].chapIdx < subj.chapters.length){
          chaps.push(subj.chapters[state[si].chapIdx]);
          state[si].chapIdx++;
        }
      }
      if(chaps.length) dayEntry.subjects.push({ name:subj.name, color:subj.color, chapters:chaps });
    });
    days.push(dayEntry);
  }
  return days;
}
