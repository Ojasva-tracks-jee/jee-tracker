    appId: "1:437462200655:web:beb5ddc9cf660b387ad53a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  window.db = db;

  // READONLY: online = readonly, local file = editable
  const _isLocal = window.location.protocol === 'file:';
  const _forceEdit = new URLSearchParams(window.location.search).get('edit') === '1';
  window.READONLY_MODE = !_isLocal && !_forceEdit;
  if(window.READONLY_MODE){ document.body.classList.add('readonly'); }
  // Apply readonly body class
  if(new URLSearchParams(window.location.search).get('view')==='1'){
    document.body.classList.add('readonly');
  }

  // Universal sync: read from Firebase, fallback to localStorage
  // Write to BOTH localStorage (fast) and Firebase (sync)
  function fbRead(key, cb){
    db.ref('tracker/'+key).once('value').then(snap=>{
      const val = snap.val();
      if(val) cb(val);
      else {
        // fallback to localStorage
        try{ const ls = JSON.parse(localStorage.getItem(key)); if(ls) cb(ls); }catch(e){}
      }
    }).catch(()=>{
      try{ const ls = JSON.parse(localStorage.getItem(key)); if(ls) cb(ls); }catch(e){}
    });
  }
  function sanitizeForFirebase(obj){
    // Firebase keys can't contain . # $ / [ ]
    // Recursively sanitize all keys
    if(typeof obj !== 'object' || obj === null) return obj;
    const out = {};
    for(const k of Object.keys(obj)){
      const cleanKey = k.replace(/[.#$/\[\]]/g, '_');
      out[cleanKey] = sanitizeForFirebase(obj[k]);
    }
    return out;
  }
  function fbWrite(key, obj){
    // Write localStorage immediately (fast UI)
    try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
    // Sanitize keys for Firebase then write
    const clean = sanitizeForFirebase(obj);
    db.ref('tracker/'+key).set(clean).catch(e=>console.warn('Firebase write failed',e));
  }
  function fbListen(key, cb){
    db.ref('tracker/'+key).on('value', snap=>{ if(snap.val()) cb(snap.val()); });
  }
</script>

  // ── NIOS PHYSICS: Electricity & Magnetism ──

  { id:9, label:"Phy Remaining-1",
    physics:[["Units and Measurements",2],["COM and System of Particles",15]],
    chem:[["Redox Reaction",7],["Structure of Atom",8]], ocUpto:81 },
  { id:10, label:"Phy Remaining-2",
    physics:[["Rotational Motion",19],["Circular Motion",10]],
    chem:[["Solutions",8],["Chemical Kinetics",7]], ocUpto:81 },
  { id:11, label:"Phy Remaining-3",
    physics:[["Kinetic Theory of Gases",3],["Thermal Properties of Matter",6],["Gravitation",2],["Mechanical Properties of Solids",1]],
    chem:[["Thermodynamics (Chem)",13],["Chemical Equilibrium",5]], ocUpto:81 },
  { id:12, label:"Phy Remaining-4",
    physics:[["Waves",9],["Electromagnetic Waves",1]],

/* ============ SCHEDULE ENGINE ============ */

// All chapters flat for Phase 1 & 2 sequential pulling
const ALL_PHY = [
  ["Mathematical Tools",7],["Motion in a Straight Line",7],["Motion in a Plane",4],["Relative Motion",4],
  ["Laws of Motion",13],["Work, Energy and Power",9],["Mechanical Properties of Fluids",9],["Thermodynamics",4],
  ["Dual Nature",4],["Atom",3],["Nuclei",3],
  ["Electric Charges, Fields and Potential",17],["Electrostatic Potential and Capacitance",6],
  ["Current Electricity",9],["Moving Charges and Magnetism",12],
  ["Electromagnetic Induction",7],["Alternating Current",3],
  ["Ray Optics and Optical Instruments",18],["Wave Optics",6],["Semiconductor",2],
  ["Waves",9],["Electromagnetic Waves",1],
];
// Phase 2 remaining
const REM_PHY = [
  ["Units and Measurements",2],["COM and System of Particles",15],["Rotational Motion",19],
  ["Circular Motion",10],["Kinetic Theory of Gases",3],["Thermal Properties of Matter",6],
  ["Gravitation",2],["Mechanical Properties of Solids",1],
];

const ALL_CHEM = [
  // IOC
  ["Chemical Bonding",20],["Coordination Compounds",14],["P-block Elements",7],
  ["D and F Block Elements",6],["S Block",3],["Hydrogen",1],
  // OC
  ["IUPAC Nomenclature",10],["General Organic Chemistry (GOC)",14],["Isomerism",17],
  ["Hydrocarbons",15],["Haloalkanes & Haloarenes",8],["Alcohols, Phenols & Ethers",6],
  ["Aldehydes, Ketones & Carboxylic Acids",6],["Amines",2],["Biomolecules",3],
  ["Polymers",1],["Chemistry in Everyday Life",2],["Environmental Chemistry",1],
  // Physical
  ["Mole Concept",14],["Redox Reaction",7],["Structure of Atom",8],["Solutions",8],
  ["Chemical Kinetics",7],["Thermodynamics (Chem)",13],["Chemical Equilibrium",5],
  ["Ionic Equilibrium",7],["Electrochemistry",6],
];

const ALL_MATHS = [
  ["Basic Mathematics",6],["Quadratic Equation",6],["Sequence & Series",5],["Trigonometry",8],
  ["Straight Lines",6],["Circles",7],["Parabola",6],["Ellipse & Hyperbola",8],
  ["Matrices",4],["Determinants",3],["Relation and Functions",8],["Inverse Trigonometric Functions",5],
  ["Limits",4],["Continuity & Differentiability",4],["Methods of Differentiation",2],
  ["Application of Derivatives",6],["Indefinite Integration",4],["Definite Integration",5],
  ["Differential Equations",3],["Vectors",4],["3-D Geometry",5],["Mathematical Reasoning",1],
];
const REM_MATHS = [
  ["Permutation & Combination",7],["Binomial Theorem",5],["Sets",2],
  ["Area Under The Curve",2],["Complex Number",7],["Probability",5],["Statistics",3],["Height & Distance",1],
];
const REM_CHEM = [
  ["Qualitative Analysis",6],["Metallurgy",1],
];

function makePointer(chapters){
  const state = chapters.map(([n,t])=>({name:n,total:t,done:0}));
  function pull(n){
    const out=[]; let need=n;
    for(const ch of state){
      if(need<=0) break;
      const avail=ch.total-ch.done; if(avail<=0) continue;
      const take=Math.min(avail,need);
      out.push({name:ch.name,start:ch.done+1,end:ch.done+take});
      ch.done+=take; need-=take;
    }
    return out;
  }
  function done(){ return state.every(c=>c.done>=c.total); }
  return {pull, done};
}

function buildSchedule(){
  const days=[];
  const phy=makePointer(ALL_PHY);
  const chem=makePointer(ALL_CHEM);
  const maths=makePointer(ALL_MATHS);

  let dayNum=1;
  let dateCursor=new Date(2026,7,13); // Aug 13 2026
  function dateStr(){ return dateCursor.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
  function nextDay(){ dayNum++; dateCursor.setDate(dateCursor.getDate()+1); }
  function lecs(arr){ return arr.reduce((s,x)=>s+(x.end-x.start+1),0); }

  // ── PHASE 1: 3M+3P+3C, when subject done its slots go Physics>Chem>Maths ──
  while(!phy.done() || !chem.done() || !maths.done()){
    let m=maths.pull(3), p=phy.pull(3), c=chem.pull(3);
    let extra=(3-lecs(m))+(3-lecs(p))+(3-lecs(c));
    if(extra>0){
      if(!phy.done()){ const f=phy.pull(extra); p.push(...f); extra-=lecs(f); }
      if(extra>0&&!chem.done()){ const f=chem.pull(extra); c.push(...f); extra-=lecs(f); }
      if(extra>0&&!maths.done()){ const f=maths.pull(extra); m.push(...f); }
    }
    days.push({day:dayNum,date:dateStr(),phase:1,isTest:false,maths:m,physics:p,chem:c});
    nextDay();
  }

  // 3 Buffer days
  for(let b=1;b<=3;b++){
    days.push({day:dayNum,date:dateStr(),phase:1,isBuffer:true,isTest:false,maths:[],physics:[],chem:[]});
    nextDay();
  }
  // Phase 1 Complete marker — no day consumed, just a banner
  days.push({day:null,date:dateStr(),phase:1,isPhase1End:true,isTest:false,maths:[],physics:[],chem:[]});
  // NO nextDay() here — day counter stays same

  // ── PHASE 2: 17 Study Stacks + 5 Test Stacks (remaining JEE chapters) ──
  const remPhy=makePointer(REM_PHY);
  const remChem=makePointer(REM_CHEM);
  const remMaths=makePointer(REM_MATHS);
  let stackNum=1;
  while(!remPhy.done() || !remChem.done() || !remMaths.done()){
    const m=remMaths.pull(3),p=remPhy.pull(2),c=remChem.pull(2);
    days.push({day:dayNum,date:dateStr(),phase:2,isTest:false,isStack:true,stackNum:stackNum++,maths:m,physics:p,chem:c});
    nextDay();
  }
  // Test stacks — ONE entry with both days inside
  for(let t=1;t<=5;t++){
    const d1date=dateStr(); nextDay();
    const d2date=dateStr(); nextDay();
    days.push({day:null,phase:2,isTest:true,isTestStack:true,testStackNum:t,
      day1date:d1date, day2date:d2date, maths:[],physics:[],chem:[]});
  }

  // ── PHASE 3: Nov 5 → Nov 28 — 16 QPTs (2 on, 1 off) ──
  const QPT_LABELS=["QPT 1","QPT 2","QPT 3","QPT 4","QPT 5","QPT 6","QPT 7","QPT 8",
    "QPT 9","QPT 10","QPT 11","QPT 12","QPT 13","QPT 14","QPT 15","QPT 16"];
  let qptIdx=0;
  dateCursor=new Date(2026,10,5);
  dayNum=Math.floor((dateCursor-new Date(2026,7,13))/86400000)+1;
  while(qptIdx<16){
    for(let i=0;i<2&&qptIdx<16;i++){
      days.push({day:dayNum,date:dateStr(),phase:3,isTest:true,isQPT:true,qptLabel:QPT_LABELS[qptIdx],maths:[],physics:[],chem:[]});
      nextDay(); qptIdx++;
    }
    if(qptIdx<16){
      days.push({day:dayNum,date:dateStr(),phase:3,isTest:false,isOff:true,maths:[],physics:[],chem:[]});
      nextDay();
    }
  }
  days.push({day:dayNum,date:dateStr(),phase:3,isTest:false,isOff:true,maths:[],physics:[],chem:[]});
  return days;
}

/* flatten into a checklist item id list for progress tracking */
function collectItems(days){
  const items=[];
  days.forEach(d=>{
    if(d.isOff || d.isTestStack || d.isQPT) return;
    ['maths','physics','chem'].forEach(subj=>{
      (d[subj]||[]).forEach((it,i)=>{
        items.push({id:`d${d.day}-${subj}-${i}-${it.name}-${it.start}-${it.end}`, day:d.day, subj, name:it.name, start:it.start, end:it.end});
      });
    });
  });
  return items;
}

// Build a list of {studyDay, dueDay, interval, subjs} from SCHEDULE
// subjs = which subjects had content that day
function buildRevisionEntries(){
  const entries = [];
  SCHEDULE.forEach(d=>{
    // Skip non-study days
    if(d.isTest || d.isBuffer || d.isPhase1End || d.isOff || d.isQPT || d.isTestStack || d.day===null) return;
    const subjs = [];
    if((d.maths||[]).length>0) subjs.push('maths');
    if((d.physics||[]).length>0) subjs.push('physics');
    if((d.chem||[]).length>0) subjs.push('chem');
    if(subjs.length===0) return;
    REVISION_INTERVALS.forEach(interval=>{
      entries.push({ studyDay:d.day, studyDate:d.date, dueDay:d.day+interval, interval, subjs });
    });
  });
  return entries;
}
const REVISION_ENTRIES = buildRevisionEntries();

function dayNumToDate(dayNum){
  const d = new Date(2026,7,13); // Aug 13 2026
  d.setDate(d.getDate() + dayNum - 1);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function ReviseTab(){
  const [checked, setChecked] = useState(loadRevise);
  const [filter, setFilter]   = useState('due');
  const todayNum = useToday();
  useEffect(()=>{ saveRevise(checked); },[checked]);
  useEffect(()=>{
    if(!READONLY) return;
    const ref = window.db.ref('tracker/'+LS_REVISE);
    ref.on('value', snap=>{ if(snap.val()) setChecked(snap.val()); });
    return ()=>ref.off();
  },[]);
  const toggle = id => { if(READONLY) return; setChecked(prev=>({...prev,[id]:!prev[id]})); };

  // Group revision entries by dueDay
  const byDueDay = {};
  REVISION_ENTRIES.forEach(e=>{
    if(!byDueDay[e.dueDay]) byDueDay[e.dueDay]=[];
    byDueDay[e.dueDay].push(e);
  });

  const dueDays = Object.keys(byDueDay).map(Number).sort((a,b)=>a-b);

  const filtered = dueDays.filter(dd=>{
    if(filter==='due')     return dd===todayNum;
    if(filter==='upcoming')return dd>todayNum && dd<=todayNum+7;
    if(filter==='pending') return dd<=todayNum;
    if(filter==='all')     return true;
    return true;
  });

  // Progress stats
  let totalTasks=0, doneTasks=0;
  REVISION_ENTRIES.forEach(e=>{
    e.subjs.forEach(subj=>{
      const tasks = REVISE_TASKS[subj][e.interval]||[];
      tasks.forEach(t=>{
        const id=sanitizeKey(`rev-d${e.studyDay}-i${e.interval}-${subj}-${t}`);
        totalTasks++;
        if(checked[id]) doneTasks++;
      });
    });
  });
  const pct = totalTasks? Math.round(doneTasks/totalTasks*100):0;

  // Today's due count
  const todayEntries = byDueDay[todayNum]||[];
  let todayTotal=0, todayDone=0;

function getUniqueChapters(items){
  // returns unique chapter names preserving order
  const seen = new Set();
  return items.filter(it=>{ if(seen.has(it.name)) return false; seen.add(it.name); return true; });
}

function buildNIOSSchedule(){
  const days = [];
  let idx = 0;
  const start = new Date(2026,7,13);
  let dayNum = 1;
  while(idx < NIOS_ALL_CHAPTERS.length){
    const dateObj = new Date(start); dateObj.setDate(start.getDate()+dayNum-1);
    const dateStr = dateObj.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    const chaptersToday = NIOS_ALL_CHAPTERS.slice(idx, idx+2);
    idx += 2;
    days.push({ day:dayNum, date:dateStr, chapters:chaptersToday });
    dayNum++;
  }
  return days;
}

                  {allDone && !isToday && <span className="badge done">Done ✓</span>}
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {d.chapters.map(ch=>{
                  const id=sanitizeKey(`nios-d${d.day}-${ch.subj}-${ch.name}`);
                  const isChk=!!checked[id];
                  return (
                    <div key={id} className={"lec-row"+(isChk?' checked':'')}>
                      <input type="checkbox" id={id} checked={isChk} onChange={()=>toggle(id)}/>
                      <label htmlFor={id}>
                        <span style={{fontSize:10,fontWeight:800,color:ch.color,marginRight:6,textTransform:'uppercase',letterSpacing:1}}>{ch.subj}</span>
                        {ch.name}
                      </label>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('study');
  return (
    <React.Fragment>
      <div className="topbar brushed">
        <div className="brand">
          <span className="mark">#PaperPhodnaHai</span>
          <span className="sub">JEE MAIN 2027 · TRACKER</span>
        </div>
        {READONLY && <div style={{fontSize:11,background:'rgba(62,207,126,0.12)',border:'1px solid rgba(62,207,126,0.3)',borderRadius:20,padding:'4px 12px',color:'var(--ok)',fontWeight:700,letterSpacing:1}}>👁 LIVE VIEW · READ ONLY</div>}
        <div className="tabs">
          <button className={"tab"+(tab==='study'?' active':'')} onClick={()=>setTab('study')}>Study</button>
          <button className={"tab"+(tab==='practice'?' active':'')} onClick={()=>setTab('practice')}>Practice</button>
          <button className={"tab"+(tab==='revise'?' active':'')} onClick={()=>setTab('revise')}>Revise</button>
          <button className={"tab"+(tab==='nios'?' active':'')} onClick={()=>setTab('nios')}>NIOS</button>
        </div>
      </div>
      <div className="container">
        {tab==='study' && <StudyTab/>}
        {tab==='practice' && <PracticeTab/>}
        {tab==='revise' && <ReviseTab/>}
        {tab==='nios' && <NIOSTab/>}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
